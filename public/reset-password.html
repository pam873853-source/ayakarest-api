<!doctype html>
<html lang="id" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — AYAKA API</title>
  <meta name="theme-color" content="#FFD600">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="/js/theme.js"></script>
</head>
<body data-page="reset">
<main class="auth-shell">
  <aside class="auth-side">
    <a class="logo" href="/"><span class="logo-mark">AYAKA</span><span class="logo-text">API</span></a>
    <div>
      <h2>New password.<br>Fresh start.</h2>
      <div class="chips"><span class="chip">X-API-Key</span><span class="chip">Magic Link</span><span class="chip">Live Analytics</span></div>
    </div>
    <p class="powered" style="position:relative;z-index:2">Powered by <strong>AYAKA Sync</strong> · Owner: OLPI STORE</p>
    <div class="big-shape" aria-hidden="true"></div>
  </aside>
  <section class="auth-main">
    <div class="auth-card">
      <div class="auth-top"><a class="logo" href="/"><span class="logo-mark">AYAKA</span><span class="logo-text">API</span></a><button class="btn btn-icon btn-ghost" data-theme-toggle type="button"></button></div>
      <div class="card">
        <h1>Reset Password</h1>
        <p class="muted">Buat password baru. Semua sesi lama akan dikeluarkan.</p>
        <div class="form-alert hidden" data-alert role="alert"></div>
        <form id="reset-form" novalidate>
          <div class="field"><label for="password">Password baru</label>
            <div class="pw-wrap"><input class="input" id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><button class="pw-toggle" type="button" data-pw-toggle aria-label="Tampilkan password" data-icon="eye"></button></div>
            <div class="pw-meter" aria-hidden="true"><span data-pw-meter></span></div>
            <span class="error-text" data-err="password"></span></div>
          <div class="field"><label for="confirm_password">Konfirmasi password</label><input class="input" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required maxlength="128"><span class="error-text" data-err="confirm_password"></span></div>
          <button class="btn btn-primary btn-lg" type="submit" style="width:100%">Simpan password baru</button>
        </form>
        <p class="switch"><a href="/login">← Kembali ke login</a></p>
      </div>
    </div>
  </section>
</main>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
